<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<title>Select meeting</title>
<link rel="stylesheet" href="app.css">
<style>
  body { padding: 16px; gap: 0; }
  h2 { font-size: 14px; margin: 0 0 12px; }
  input { width: 100%; margin-bottom: 12px; }
  .list {
    list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 8px;
  }
  .list li {
    padding: 10px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 2px;
  }
  .list li:last-child { border-bottom: none; }
  .list li:hover, .list li.active { background: var(--accent-soft); }
  .list li .name { font-weight: 600; }
  .list li .meta { font-size: 11px; color: var(--muted); }
  .list .empty { padding: 12px; color: var(--muted); font-size: 12px; }
  .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
</style>
</head>
<body>
  <h2>Select a meeting to log</h2>
  <input id="search" type="text" placeholder="Filter meetings…" autofocus>
  <ul id="list" class="list"></ul>
  <div class="btns">
    <button id="cancel">Cancel</button>
  </div>
  <script src="dynamic-picker.js"></script>
</body>
</html>

<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#0B2A6B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Rounded-square background (macOS "squircle"-ish) -->
  <rect x="112" y="112" width="800" height="800" rx="190" fill="url(#bg)"/>
  <!-- subtle top sheen -->
  <rect x="112" y="112" width="800" height="800" rx="190" fill="#ffffff" opacity="0.06"/>

  <!-- Clock face -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="248" fill="url(#ring)"/>
    <circle cx="512" cy="512" r="210" fill="#1E40AF"/>
    <circle cx="512" cy="512" r="210" fill="#10224F"/>
  </g>

  <!-- Tick marks (12 / 3 / 6 / 9 emphasized) -->
  <g fill="#9DB8F5">
    <rect x="500" y="322" width="24" height="46" rx="12"/>
    <rect x="500" y="656" width="24" height="46" rx="12"/>
    <rect x="322" y="500" width="46" height="24" rx="12"/>
    <rect x="656" y="500" width="46" height="24" rx="12"/>
  </g>

  <!-- Hands: hour (up-right) + minute (up) -->
  <g stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="372" stroke="#FFFFFF" stroke-width="26"/>
    <line x1="512" y1="512" x2="624" y2="560" stroke="#60A5FA" stroke-width="22"/>
    <circle cx="512" cy="512" r="26" fill="#FFFFFF"/>
  </g>

  <!-- Small "check" accent (logged time) bottom-right of the face -->
  <g transform="translate(636,636)">
    <circle r="78" fill="#22C55E"/>
    <path d="M -34 4 L -10 30 L 38 -28" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

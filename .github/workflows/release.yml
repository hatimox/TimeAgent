name: Release

# Push a version tag (e.g. 0.0.2 or v0.0.2) and this builds macOS + Linux +
# Windows installers and publishes them to the GitHub Release for that tag.
# The app version is taken FROM THE TAG, so package.json never has to be bumped
# manually — tag and artifacts can't disagree.
on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write   # needed to create/publish the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false        # one platform failing shouldn't cancel the others
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Derive the version from the tag (strip any leading "v") and write it
      # into package.json so electron-builder uses exactly the tagged version.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version: $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Linux: libsecret headers for keytar's native build.
      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      # Publish to the Release matching this tag (creates it if missing,
      # published — not draft — so users' auto-update can read latest*.yml).
      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # (Optional) mac code signing — set these repo secrets to notarize:
          # CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
        run: npx electron-builder --publish always
